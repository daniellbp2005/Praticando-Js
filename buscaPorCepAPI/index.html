<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca Por CEP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Buscar Endereço pelo CEP</h1>
    <label for="cep">CEP:</label>
    <input type="text" id="cep" placeholder="Digite o Cep...">
    <button id="btnBuscar">Buscar</button>

    <form class="formulario">
        <label for="rua">Rua:</label>
        <input type="text" id="rua" placeholder="Digite o Nome da Rua...."  >

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" placeholder="Digite o Nome do Bairro....">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Digite o Nome da cidade....">

        <label for="estado">Estado:</label>
        <input type="text" id="estado" placeholder="Digite o Nome do Estado...."> 
    </form>
    <script src="script.js"></script>
</body>

</html>
