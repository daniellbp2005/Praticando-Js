<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Claro e Escuro</title>
    <link rel="stylesheet" href="styles/style.css" id="tema-claro">
</head>
<body>
    <div id="caixa">
        <h1 id="titulo">Modo Claro e Escuro</h1>
        <p id="texto">Clique no botão para mudar o Modo</p>
        <button id="btn">Ativar modo Escuro</button>
        <div class="centralizar">
            <div class="lado-e"><button id="curtir">Curtir</button></div>
            <div class="lado-d"><img src="like-removebg-preview.png" alt=""></div>
        </div>
    </div>
    <!-- <div class="caixa2">
        <h2 class="novoTitulo">Novo Título</h2>
    </div> -->
    <div class="conteiner">
        <form>
            <input type="text" placeholder="Escreva seu Nome" id="usuario">
            <input type="email" placeholder="Escreva seu Email" id="email">
            <input type="password" placeholder="Escreva seu Senha" id="senha">
            <button class="btn-form" id="btn-form">Entrar</button>
            <p id="form-p">Faça seu Login</p>
        </form>
    </div>
    <script src="JavaScript/script.js"></script>
</body>
</html>
