<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Busca Produto</h1>
    <label for="produto">Produto: </label>
    <input type="text" id="produto" placeholder="Digite o Produto">
    <button id="buscar">Buscar</button>

    <form class="formulario">
        <label for="rua">Nome</label>
        <input type="text" id="nome" placeholder="Produto"  >

        <label for="bairro">Preço</label>
        <input type="text" id="preco" placeholder="Preço">

        <label for="cidade">Categoria</label>
        <input type="text" id="categoria" placeholder="Categoria">

    </form>
    <script src="script.js"></script>
</body>
</html>
