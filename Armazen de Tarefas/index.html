<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armazen de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="scripty.js"></script>
    <!-- defer carrega primeiro o html e depois o js, evitando erros de
    carregamento. -->
</head>

<body>
    <div class="classe">
        <p class="fala">Bem-vindo à sua lista de tarefas!</p>
        <p class="algo">Contagem de tarefas: <span id="contador">0</span> 🔥</p>
    </div>
    <main id="caixa">
        <h1 id="titulo">Lista de Tarefas</h1>
        <div>
            <input type="text" id="tarefa" placeholder="Digite sua tarefa aqui...">
            <button type="submit" id="btn-add">Adicionar</button>
        </div>
        <ul id="lista"></ul>
    </main>
</body>

</html>
